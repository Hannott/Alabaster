# Your Alabaster macro pack settings
#
# alabaster.cfg is managed by Moonraker's update manager and is read-only.
# This file is yours: the installer creates it once, next to alabaster.cfg,
# and updates never touch it. alabaster.cfg includes it at its end, so any
# value set here replaces the pack's default.
#
# Every setting is listed below, commented out, with its default. To change
# one, remove the # in front of its line and edit the value, then restart
# Klipper. A setting left commented out keeps the pack's default, including
# when a later release improves that default.


# --------------------------------------------------------------------------
# Pause, resume, and cancel
# --------------------------------------------------------------------------

[gcode_macro _ALABASTER]
# Where the nozzle goes when a print pauses or is cancelled.
#   park_x / park_y   Set to -1 to use the middle of your bed. Otherwise a
#                     position in millimetres.
#   park_lift         How far Z rises before travelling, in millimetres. Never
#                     goes past the top of your Z axis.
#   park_enabled      Set to False to pause in place without moving at all.
#variable_park_enabled: True
#variable_park_x: -1
#variable_park_y: -1
#variable_park_lift: 10.0
# How far the filament pulls back when pausing, so it does not ooze onto the
# print while you are away, and what it does on the way back.
#variable_retract: 1.0
#variable_retract_speed: 35
#variable_unretract_extra: 0.0
#variable_unretract_speed: 35
# Travel speed for parking and for the move back, in millimetres per second.
#variable_travel_speed: 200
# Whether a cancelled print parks as well as a paused one.
#variable_park_at_cancel: True
# Turn the hotend off when a pause lasts this many seconds. 0 leaves it on.
# Useful if you pause prints and walk away; the bed is left alone either way.
# On resume the hotend heats back up to the temperature the print was using.
#variable_pause_extruder_off_after: 0
# How long Klipper may sit idle during a pause before its idle timeout turns
# the heaters and motors off, in seconds. Klipper's own default is 600, and once
# the motors are off a paused print cannot be resumed. Your configured timeout
# comes back on resume or cancel. 0 leaves Klipper's timeout alone.
#variable_pause_idle_timeout: 3600
# Your own macros, run at fixed points: after the nozzle has parked on pause,
# before the nozzle returns on resume, and after a cancel has finished. Give a
# macro name, such as '_MY_PAUSE', or '' for none. A name that is not defined
# is reported and skipped; it never stops the pause, resume, or cancel. The
# macros themselves can live in this file too.
#variable_user_pause_macro: ''
#variable_user_resume_macro: ''
#variable_user_cancel_macro: ''


# --------------------------------------------------------------------------
# Filament
# --------------------------------------------------------------------------
#
# Lengths and speeds for LOAD_FILAMENT and UNLOAD_FILAMENT. Set the load and
# unload lengths to the distance between your extruder and your nozzle.

[gcode_macro _ALABASTER_FILAMENT]
#variable_load_length: 90
#variable_load_speed: 10
#variable_purge_length: 40
#variable_purge_speed: 3
#variable_unload_length: 100
#variable_unload_speed: 10
#variable_minimum_temperature: 180


# --------------------------------------------------------------------------
# Purge
# --------------------------------------------------------------------------
#
# Settings for ADAPTIVE_PURGE, the purge line drawn beside the print.

[gcode_macro _ALABASTER_PURGE]
# How much filament to push through, in millimetres of filament. 0 skips
# the purge.
#variable_amount: 30
# How long the line is, in millimetres. A short line is a fat one, and
# max_extrude_cross_section in your [extruder] section caps how fat: below
# what this length needs, the line is lengthened, folding into rows when it
# runs out of room, and the console says what to set the limit to.
#variable_line_length: 30
# How fast plastic flows during the purge, in cubic millimetres per second.
# Keep it at or below what your hotend can melt.
#variable_flow: 10
# Nozzle height at the start of the line, in millimetres. Close to the bed,
# so the bed wipes off what hangs on the side of the nozzle.
#variable_start_height: 0.2
# Nozzle height at the end of the line, which it climbs to along its length.
# About twice your nozzle diameter, so the line ends clean of the bed.
#variable_end_height: 0.8
# Gap between the line and the objects, in millimetres. Keep it wider than
# your skirt or brim, which the object labels do not include.
#variable_margin: 10
# How close the line may come to the ends of your X and Y travel.
#variable_edge: 5
# Sides of the print the line may use. Front is the low-Y side. Of the sides
# with room, the one ending closest to the start point wins; a tie goes to
# the one listed first.
#variable_sides: 'front, left, right, back'
# How far the filament has to move to reach the nozzle before plastic comes
# out: your end G-code's final retract. 0 if it does not retract.
#variable_tip_distance: 0
# How far the filament pulls back as the nozzle leaves the line, which snaps
# the strand off at the purge instead of dragging it to the print. It is
# pushed back out once the nozzle reaches the print, at the unretract_speed
# in the _ALABASTER block above.
#variable_retract: 0.8
