# Alabaster macro pack
#
# This file gives Alabaster the macros its own controls call, and gives your
# printer a pause that gets the nozzle off the print.
#
# Install it next to printer.cfg and add this line near the top of printer.cfg:
#
#     [include alabaster.cfg]
#
# Everything you would want to change lives in the [gcode_macro _ALABASTER]
# block below. You should not need to edit anything under it.
#
# IMPORTANT — this file defines PAUSE, RESUME, and CANCEL_PRINT. If another
# Klipper web interface's macro pack is already included in your printer.cfg, it
# defines the same names and Klipper will refuse to start with a duplicate. Use
# one pack or the other, not both. The installer checks for this and tells you
# before it changes anything.


# --------------------------------------------------------------------------
# Sections Alabaster reads
# --------------------------------------------------------------------------
#
# [display_status] is enabled automatically when your printer.cfg has a
# [display] section. If it does, delete the [display_status] line below —
# Klipper treats declaring it twice as an error.

[pause_resume]

[display_status]

[respond]

[exclude_object]

# ~/printer_data/gcodes is the gcodes root every current Klipper install uses.
# An older install that still points elsewhere (~/gcode_files, for one) should
# edit the path below to match, or delete this section and keep its own — the
# installer's conflict check catches the common case of it already being
# declared somewhere else in your configuration.
[virtual_sdcard]
path: ~/printer_data/gcodes
# A file error mid-print is exactly what CANCEL_PRINT above exists to clean up
# after: heaters off, nozzle parked, the file reset.
on_error_gcode: CANCEL_PRINT


# --------------------------------------------------------------------------
# Your settings
# --------------------------------------------------------------------------

[gcode_macro _ALABASTER]
description: Alabaster's settings. Edit the values here, not the macros below.
# Where the nozzle goes when a print pauses or is cancelled.
#   park_x / park_y   Set to -1 to use the middle of your bed. Otherwise a
#                     position in millimetres.
#   park_lift         How far Z rises before travelling, in millimetres. Never
#                     goes past the top of your Z axis.
#   park_enabled      Set to False to pause in place without moving at all.
variable_park_enabled: True
variable_park_x: -1
variable_park_y: -1
variable_park_lift: 10.0
# How far the filament pulls back when pausing, so it does not ooze onto the
# print while you are away, and what it does on the way back.
variable_retract: 1.0
variable_retract_speed: 35
variable_unretract_extra: 0.0
variable_unretract_speed: 35
# Travel speed for parking and for the move back, in millimetres per second.
variable_travel_speed: 200
# Whether a cancelled print parks as well as a paused one.
variable_park_at_cancel: True
# Turn the hotend off when a pause lasts this many seconds. 0 leaves it on.
# Useful if you pause prints and walk away; the bed is left alone either way.
variable_pause_extruder_off_after: 0
gcode:
  # A settings block does nothing on its own. Klipper requires the key.


# Runtime state. Alabaster writes these; you do not need to read or change them.
[gcode_macro _ALABASTER_STATE]
description: Alabaster's internal state. Do not edit.
variable_pause_at_layer: -1
variable_pause_macro: 'PAUSE'
gcode:
  # See above; Klipper requires the key.


# --------------------------------------------------------------------------
# Helpers
# --------------------------------------------------------------------------
#
# Leading underscores keep these out of Alabaster's macro picker, which only
# offers macros a person would run deliberately.

[gcode_macro _ALABASTER_PARK]
description: Lift Z and move the nozzle clear of the print.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% if settings.park_enabled %}
    {% set maximum = printer.toolhead.axis_maximum %}
    {% set minimum = printer.toolhead.axis_minimum %}
    {% set target_x = settings.park_x if settings.park_x >= 0
                      else (minimum.x + maximum.x) / 2.0 %}
    {% set target_y = settings.park_y if settings.park_y >= 0
                      else (minimum.y + maximum.y) / 2.0 %}
    {% set lifted = [printer.toolhead.position.z + settings.park_lift,
                     maximum.z] | min %}
    {% set speed = settings.travel_speed * 60 %}
    # Only a homed axis knows where it is; moving an unhomed one is how a
    # pause turns into a crash.
    {% if "z" in printer.toolhead.homed_axes %}
      G90
      G1 Z{lifted} F{speed}
    {% endif %}
    {% if "xy" in printer.toolhead.homed_axes %}
      G90
      G1 X{target_x} Y{target_y} F{speed}
    {% else %}
      RESPOND TYPE=echo MSG="Alabaster: X and Y are not homed, so the nozzle stayed where it was."
    {% endif %}
  {% endif %}

[gcode_macro _ALABASTER_RETRACT]
description: Pull the filament back, if the hotend is hot enough to allow it.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% if settings.retract > 0 and printer.extruder.can_extrude %}
    M83
    G1 E-{settings.retract} F{settings.retract_speed * 60}
  {% endif %}

[gcode_macro _ALABASTER_UNRETRACT]
description: Push the filament back before resuming.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% set length = settings.retract + settings.unretract_extra %}
  {% if length > 0 and printer.extruder.can_extrude %}
    M83
    G1 E{length} F{settings.unretract_speed * 60}
  {% endif %}

# Runs once, the configured number of seconds into a pause. Re-armed by PAUSE
# and disarmed by RESUME and CANCEL_PRINT, so it can never fire into a print
# that has already started moving again.
[delayed_gcode _ALABASTER_PAUSE_EXTRUDER_OFF]
gcode:
  {% if printer.pause_resume.is_paused %}
    M104 S0
    RESPOND TYPE=echo MSG="Alabaster: hotend turned off after a long pause."
  {% endif %}


# --------------------------------------------------------------------------
# Print controls
# --------------------------------------------------------------------------

[gcode_macro PAUSE]
description: Pause the print, lifting and parking the nozzle.
rename_existing: _ALABASTER_PAUSE_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND TYPE=echo MSG="Alabaster: already paused."
  {% else %}
    {% set settings = printer["gcode_macro _ALABASTER"] %}
    SAVE_GCODE_STATE NAME=_ALABASTER_PAUSE_STATE
    # The base pause records the position RESUME returns to, so it has to run
    # before anything below moves the toolhead.
    _ALABASTER_PAUSE_BASE
    _ALABASTER_RETRACT
    _ALABASTER_PARK
    {% if settings.pause_extruder_off_after > 0 %}
      UPDATE_DELAYED_GCODE ID=_ALABASTER_PAUSE_EXTRUDER_OFF DURATION={settings.pause_extruder_off_after}
    {% endif %}
  {% endif %}

[gcode_macro RESUME]
description: Resume a paused print.
rename_existing: _ALABASTER_RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    {% set settings = printer["gcode_macro _ALABASTER"] %}
    UPDATE_DELAYED_GCODE ID=_ALABASTER_PAUSE_EXTRUDER_OFF DURATION=0
    # A pause that turned the hotend off leaves it cold. Bring it back to the
    # target the print was using before trying to move filament through it.
    {% if printer.extruder.target == 0 and printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="Alabaster: the hotend is off. Set its temperature, then resume again."
    {% else %}
      M109 S{printer.extruder.target}
      _ALABASTER_UNRETRACT
      RESTORE_GCODE_STATE NAME=_ALABASTER_PAUSE_STATE MOVE=1 MOVE_SPEED={settings.travel_speed}
      _ALABASTER_RESUME_BASE
    {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG="Alabaster: nothing is paused."
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the print and park the nozzle.
rename_existing: _ALABASTER_CANCEL_BASE
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE=-1
  UPDATE_DELAYED_GCODE ID=_ALABASTER_PAUSE_EXTRUDER_OFF DURATION=0
  TURN_OFF_HEATERS
  M107
  {% if settings.park_at_cancel %}
    _ALABASTER_RETRACT
    _ALABASTER_PARK
  {% endif %}
  CLEAR_PAUSE
  _ALABASTER_CANCEL_BASE


# --------------------------------------------------------------------------
# Pausing at a layer
# --------------------------------------------------------------------------
#
# Klipper has no idea what a layer is. These work because slicers announce each
# layer with SET_PRINT_STATS_INFO, which the wrapper below listens to.
#
# For this to do anything, your slicer has to emit that command — most do it as
# part of their Klipper output. Alabaster hides both controls on a printer where
# these macros are not defined, so nothing here is required.

[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause the print when the given layer starts. ENABLE=0 cancels it.
gcode:
  {% set enable = params.ENABLE | default(1) | int %}
  {% set layer = params.LAYER | default(0) | int %}
  {% set macro = params.MACRO | default("PAUSE") %}
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE={ layer if enable else -1 }
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_macro VALUE="'{ macro }'"
  {% if enable %}
    RESPOND TYPE=echo MSG="Alabaster: will pause at layer { layer }."
  {% else %}
    RESPOND TYPE=echo MSG="Alabaster: layer pause cancelled."
  {% endif %}

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause the print when the current layer finishes. ENABLE=0 cancels it.
gcode:
  {% set enable = params.ENABLE | default(1) | int %}
  {% set macro = params.MACRO | default("PAUSE") %}
  {% set current = printer.print_stats.info.current_layer | default(0) | int %}
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE={ (current + 1) if enable else -1 }
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_macro VALUE="'{ macro }'"
  {% if enable %}
    RESPOND TYPE=echo MSG="Alabaster: will pause when layer { current } finishes."
  {% else %}
    RESPOND TYPE=echo MSG="Alabaster: layer pause cancelled."
  {% endif %}

# Wraps the command slicers use to report progress, so an armed layer is
# noticed the moment the print reaches it. The base command always runs first:
# the layer counters Alabaster displays come from it, and they must keep
# working whether or not a pause is armed.
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _ALABASTER_PRINT_STATS_INFO_BASE
gcode:
  _ALABASTER_PRINT_STATS_INFO_BASE {rawparams}
  {% set armed = printer["gcode_macro _ALABASTER_STATE"].pause_at_layer | int %}
  {% if armed >= 0 and params.CURRENT_LAYER is defined %}
    {% if params.CURRENT_LAYER | int >= armed %}
      SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE=-1
      { printer["gcode_macro _ALABASTER_STATE"].pause_macro }
    {% endif %}
  {% endif %}


# --------------------------------------------------------------------------
# Filament
# --------------------------------------------------------------------------
#
# Klipper defines no load or unload macros of its own, so Alabaster's Extruder
# card has nothing to offer until something does. These are deliberately plain:
# they move filament and nothing else. Change the lengths to match the distance
# between your extruder and your nozzle.

[gcode_macro _ALABASTER_FILAMENT]
description: Lengths and speeds for loading and unloading. Edit these to match your printer.
variable_load_length: 90
variable_load_speed: 10
variable_purge_length: 40
variable_purge_speed: 3
variable_unload_length: 100
variable_unload_speed: 10
variable_minimum_temperature: 180
gcode:
  # Settings only; Klipper requires the key.

[gcode_macro LOAD_FILAMENT]
description: Feed filament to the nozzle and purge.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER_FILAMENT"] %}
  {% if printer.extruder.temperature < settings.minimum_temperature %}
    RESPOND TYPE=error MSG="Alabaster: heat the hotend to at least { settings.minimum_temperature }C first."
  {% else %}
    SAVE_GCODE_STATE NAME=_ALABASTER_FILAMENT_STATE
    M83
    G1 E{settings.load_length} F{settings.load_speed * 60}
    G1 E{settings.purge_length} F{settings.purge_speed * 60}
    RESTORE_GCODE_STATE NAME=_ALABASTER_FILAMENT_STATE
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Retract filament clear of the hotend.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER_FILAMENT"] %}
  {% if printer.extruder.temperature < settings.minimum_temperature %}
    RESPOND TYPE=error MSG="Alabaster: heat the hotend to at least { settings.minimum_temperature }C first."
  {% else %}
    SAVE_GCODE_STATE NAME=_ALABASTER_FILAMENT_STATE
    M83
    # A short purge first softens the tip, so the filament leaves cleanly
    # rather than dragging a string back up the heat break.
    G1 E{settings.purge_length / 4} F{settings.purge_speed * 60}
    G1 E-{settings.unload_length} F{settings.unload_speed * 60}
    RESTORE_GCODE_STATE NAME=_ALABASTER_FILAMENT_STATE
  {% endif %}
