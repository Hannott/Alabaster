# Alabaster macro pack
#
# This file gives Alabaster the macros its own controls call, and gives your
# printer a pause that gets the nozzle off the print.
#
# Install it next to printer.cfg and add this line near the top of printer.cfg:
#
#     [include alabaster.cfg]
#
# Do not edit this file. It is usually a link into a git clone that
# Moonraker's update manager owns, which makes it read-only. Change settings
# in alabaster-user.cfg next to it instead: the installer creates it with
# every setting listed, and this file includes it at its end, so the values
# you set there replace the defaults here. Klipper merges sections with the
# same name, so only the values you list change:
#
#     [gcode_macro _ALABASTER]
#     variable_park_x: 290
#     variable_user_pause_macro: '_MY_PAUSE'
#
# IMPORTANT — this file defines PAUSE, RESUME, and CANCEL_PRINT, and that same
# merging works against you here. Klipper does not complain when another file
# defines them again: the definition included last silently wins. Another
# Klipper web interface's macro pack, or a PAUSE of your own included after
# this file, replaces these without a word, and the layer-pause cleanup and
# every setting below stop working with them. Use one pack, not two — the
# installer checks for this before it changes anything — and put your own
# pause, resume, and cancel steps in the user_*_macro hooks below instead of
# redefining the macros.


# --------------------------------------------------------------------------
# Sections Alabaster reads
# --------------------------------------------------------------------------
#
# [display_status] is enabled automatically when your printer.cfg has a
# [display] section. If it does, delete the [display_status] line below —
# Klipper treats declaring it twice as an error.

[pause_resume]

[display_status]

[respond]

[exclude_object]

# ~/printer_data/gcodes is the gcodes root every current Klipper install uses.
# An older install that still points elsewhere (~/gcode_files, for one) should
# edit the path below to match, or delete this section and keep its own — the
# installer's conflict check catches the common case of it already being
# declared somewhere else in your configuration.
[virtual_sdcard]
path: ~/printer_data/gcodes
# A file error mid-print is exactly what CANCEL_PRINT above exists to clean up
# after: heaters off, nozzle parked, the file reset.
on_error_gcode: CANCEL_PRINT


# --------------------------------------------------------------------------
# Defaults
# --------------------------------------------------------------------------
#
# The settings blocks in this file hold defaults only. What each setting does
# is described in alabaster-user.cfg, where you change it.

[gcode_macro _ALABASTER]
description: Alabaster's pause, resume, and cancel settings. Change them in alabaster-user.cfg.
variable_park_enabled: True
variable_park_x: -1
variable_park_y: -1
variable_park_lift: 10.0
variable_retract: 1.0
variable_retract_speed: 35
variable_unretract_extra: 0.0
variable_unretract_speed: 35
variable_travel_speed: 200
variable_park_at_cancel: True
variable_pause_extruder_off_after: 0
variable_pause_idle_timeout: 3600
variable_user_pause_macro: ''
variable_user_resume_macro: ''
variable_user_cancel_macro: ''
gcode:
  # A settings block does nothing on its own. Klipper requires the key.


# Runtime state. Alabaster writes these; you do not need to change them. A
# resume macro of your own may read resume_x, resume_y, and resume_z (where the
# print stopped, in G-code coordinates) and resume_temperature.
[gcode_macro _ALABASTER_STATE]
description: Alabaster's internal state. Do not edit.
variable_pause_at_layer: -1
variable_pause_macro: 'PAUSE'
variable_pause_checked_at: 0.0
variable_resume_x: 0.0
variable_resume_y: 0.0
variable_resume_z: 0.0
variable_resume_temperature: 0.0
gcode:
  # See above; Klipper requires the key.


# --------------------------------------------------------------------------
# Helpers
# --------------------------------------------------------------------------
#
# Leading underscores keep these out of Alabaster's macro picker, which only
# offers macros a person would run deliberately.

[gcode_macro _ALABASTER_PARK]
description: Lift Z and move the nozzle clear of the print.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% if settings.park_enabled %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set maximum = printer.toolhead.axis_maximum %}
    {% set minimum = printer.toolhead.axis_minimum %}
    {% set target_x = settings.park_x if settings.park_x >= 0
                      else (minimum.x + maximum.x) / 2.0 %}
    {% set target_y = settings.park_y if settings.park_y >= 0
                      else (minimum.y + maximum.y) / 2.0 %}
    # Relative, and measured against the toolhead's own position: an absolute
    # Z would pass through SET_GCODE_OFFSET a second time and could ask for a
    # height past the top of the axis.
    {% set lift = [settings.park_lift,
                   maximum.z - printer.toolhead.position.z] | min %}
    {% set speed = settings.travel_speed * 60 %}
    SAVE_GCODE_STATE NAME=_ALABASTER_PARK_STATE
    # Only a homed axis knows where it is; moving an unhomed one is how a
    # pause turns into a crash.
    {% if "z" in homed and lift > 0 %}
      G91
      G1 Z{lift} F{speed}
    {% endif %}
    {% if "x" in homed and "y" in homed %}
      G90
      G1 X{target_x} Y{target_y} F{speed}
    {% else %}
      RESPOND MSG="Alabaster: X and Y are not homed, so the nozzle stayed where it was."
    {% endif %}
    RESTORE_GCODE_STATE NAME=_ALABASTER_PARK_STATE
  {% endif %}

[gcode_macro _ALABASTER_RETRACT]
description: Pull the filament back, if the hotend is hot enough to allow it.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% set extruder = printer.toolhead.extruder %}
  {% if extruder and settings.retract > 0 and printer[extruder].can_extrude %}
    SAVE_GCODE_STATE NAME=_ALABASTER_RETRACT_STATE
    M83
    G1 E-{settings.retract} F{settings.retract_speed * 60}
    RESTORE_GCODE_STATE NAME=_ALABASTER_RETRACT_STATE
  {% endif %}

[gcode_macro _ALABASTER_UNRETRACT]
description: Push the filament back before resuming.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% set extruder = printer.toolhead.extruder %}
  {% set length = settings.retract + settings.unretract_extra %}
  {% if extruder and length > 0 and printer[extruder].can_extrude %}
    SAVE_GCODE_STATE NAME=_ALABASTER_UNRETRACT_STATE
    M83
    G1 E{length} F{settings.unretract_speed * 60}
    RESTORE_GCODE_STATE NAME=_ALABASTER_UNRETRACT_STATE
  {% endif %}

# The hotend may have been turned off during the pause, by the timer below or
# by hand. The target the print was using comes back, unless someone has set a
# new one since.
[gcode_macro _ALABASTER_REHEAT]
description: Bring the hotend back to printing temperature.
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% if extruder %}
    {% set current = printer[extruder].target %}
    {% set target = current if current > 0
                    else printer["gcode_macro _ALABASTER_STATE"].resume_temperature %}
    {% if target > 0 %}
      M109 S{target}
    {% endif %}
  {% endif %}

[gcode_macro _ALABASTER_RETURN]
description: Travel back over the print at park height, then lower onto it.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  {% set state = printer["gcode_macro _ALABASTER_STATE"] %}
  {% set homed = printer.toolhead.homed_axes %}
  # Across first, then down. Lowering on the way skims the end of the trip
  # just above the top layer, where a curled edge is waiting to be hit.
  {% if "x" in homed and "y" in homed %}
    G90
    G1 X{state.resume_x} Y{state.resume_y} F{settings.travel_speed * 60}
  {% endif %}
  RESTORE_GCODE_STATE NAME=_ALABASTER_PAUSE_STATE MOVE=1 MOVE_SPEED={settings.travel_speed}

[gcode_macro _ALABASTER_RESTORE_IDLE_TIMEOUT]
description: Put back the idle timeout a pause raised.
gcode:
  {% if printer["gcode_macro _ALABASTER"].pause_idle_timeout > 0 %}
    {% set configured = printer.configfile.settings.idle_timeout | default({}) %}
    SET_IDLE_TIMEOUT TIMEOUT={configured.timeout | default(600)}
  {% endif %}

# Checked rather than called blind: Klipper answers an unknown command with a
# console line and carries on, so a misspelled name would skip your steps
# without anything looking wrong.
[gcode_macro _ALABASTER_HOOK]
description: Run the macro a user_*_macro setting names, if it exists.
gcode:
  {% set setting = params.SETTING | lower %}
  {% set name = printer["gcode_macro _ALABASTER"][setting] | default('') | string | trim %}
  {% if name %}
    {% if ("gcode_macro " ~ name) in printer
          or ("gcode_macro " ~ name | upper) in printer
          or ("gcode_macro " ~ name | lower) in printer %}
      {name}
    {% else %}
      RESPOND TYPE=error MSG="Alabaster: {setting} names {name}, which is not a macro on this printer. Skipped."
    {% endif %}
  {% endif %}

# Runs once, the configured number of seconds into a pause. Re-armed by PAUSE
# and disarmed by RESUME and CANCEL_PRINT, so it can never fire into a print
# that has already started moving again.
[delayed_gcode _ALABASTER_PAUSE_EXTRUDER_OFF]
gcode:
  {% if printer.pause_resume.is_paused %}
    M104 S0
    RESPOND MSG="Alabaster: hotend turned off after a long pause."
  {% endif %}


# --------------------------------------------------------------------------
# Print controls
# --------------------------------------------------------------------------

[gcode_macro PAUSE]
description: Pause the print, lifting and parking the nozzle.
rename_existing: _ALABASTER_PAUSE_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Alabaster: already paused."
  {% else %}
    {% set settings = printer["gcode_macro _ALABASTER"] %}
    {% set extruder = printer.toolhead.extruder %}
    {% set position = printer.gcode_move.gcode_position %}
    SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=resume_x VALUE={position.x}
    SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=resume_y VALUE={position.y}
    SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=resume_z VALUE={position.z}
    SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=resume_temperature VALUE={printer[extruder].target if extruder else 0}
    SAVE_GCODE_STATE NAME=_ALABASTER_PAUSE_STATE
    # The base pause records the position RESUME returns to, so it has to run
    # before anything below moves the toolhead.
    _ALABASTER_PAUSE_BASE
    _ALABASTER_RETRACT
    _ALABASTER_PARK
    {% if settings.pause_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={settings.pause_idle_timeout}
    {% endif %}
    {% if settings.pause_extruder_off_after > 0 %}
      UPDATE_DELAYED_GCODE ID=_ALABASTER_PAUSE_EXTRUDER_OFF DURATION={settings.pause_extruder_off_after}
    {% endif %}
    # Your pause macro starts with the nozzle parked, not still on its way.
    M400
    _ALABASTER_HOOK SETTING=user_pause_macro
  {% endif %}

[gcode_macro RESUME]
description: Resume a paused print.
rename_existing: _ALABASTER_RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    UPDATE_DELAYED_GCODE ID=_ALABASTER_PAUSE_EXTRUDER_OFF DURATION=0
    _ALABASTER_RESTORE_IDLE_TIMEOUT
    _ALABASTER_HOOK SETTING=user_resume_macro
    _ALABASTER_REHEAT
    _ALABASTER_RETURN
    # Primed over the print rather than at the park position, so the
    # filament pushed back out cannot string across the part on the way.
    _ALABASTER_UNRETRACT
    _ALABASTER_RESUME_BASE
  {% else %}
    RESPOND MSG="Alabaster: nothing is paused."
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the print and park the nozzle.
rename_existing: _ALABASTER_CANCEL_BASE
gcode:
  {% set settings = printer["gcode_macro _ALABASTER"] %}
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE=-1
  UPDATE_DELAYED_GCODE ID=_ALABASTER_PAUSE_EXTRUDER_OFF DURATION=0
  {% if printer.pause_resume.is_paused %}
    _ALABASTER_RESTORE_IDLE_TIMEOUT
  {% endif %}
  TURN_OFF_HEATERS
  M107
  {% if settings.park_at_cancel %}
    _ALABASTER_RETRACT
    _ALABASTER_PARK
  {% endif %}
  M400
  CLEAR_PAUSE
  _ALABASTER_CANCEL_BASE
  # After the cancel itself, so a cancel macro of your own that fails cannot
  # leave the print running.
  _ALABASTER_HOOK SETTING=user_cancel_macro


# --------------------------------------------------------------------------
# Pausing at a layer
# --------------------------------------------------------------------------
#
# Klipper has no idea what a layer is. These work because slicers announce each
# layer with SET_PRINT_STATS_INFO, which the wrapper below listens to.
#
# For this to do anything, your slicer has to emit that command — most do it as
# part of their Klipper output. Alabaster hides both controls on a printer where
# these macros are not defined, so nothing here is required.

[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause the print when the given layer starts. ENABLE=0 cancels it.
gcode:
  {% set enable = params.ENABLE | default(1) | int %}
  {% set layer = params.LAYER | default(0) | int %}
  {% set macro = params.MACRO | default("PAUSE") %}
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE={ layer if enable else -1 }
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_macro VALUE="'{ macro }'"
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_checked_at VALUE={ printer.print_stats.total_duration }
  {% if enable %}
    RESPOND MSG="Alabaster: will pause at layer { layer }."
    _ALABASTER_CHECK_LAYERS
  {% else %}
    RESPOND MSG="Alabaster: layer pause cancelled."
  {% endif %}

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause the print when the current layer finishes. ENABLE=0 cancels it.
gcode:
  {% set enable = params.ENABLE | default(1) | int %}
  {% set macro = params.MACRO | default("PAUSE") %}
  {% set current = printer.print_stats.info.current_layer | default(0) | int %}
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE={ (current + 1) if enable else -1 }
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_macro VALUE="'{ macro }'"
  SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_checked_at VALUE={ printer.print_stats.total_duration }
  {% if enable %}
    RESPOND MSG="Alabaster: will pause when layer { current } finishes."
    _ALABASTER_CHECK_LAYERS
  {% else %}
    RESPOND MSG="Alabaster: layer pause cancelled."
  {% endif %}

[gcode_macro _ALABASTER_CHECK_LAYERS]
description: Warn when the print reports no layers, so an armed pause could never trigger.
gcode:
  {% set info = printer.print_stats.info %}
  {% if info.current_layer is none and info.total_layer is none %}
    RESPOND TYPE=error MSG="Alabaster: this print does not report its layers, so the layer pause will not trigger. The slicer has to send SET_PRINT_STATS_INFO."
  {% endif %}

# Wraps the command slicers use to report progress, so an armed layer is
# noticed the moment the print reaches it. The base command always runs first:
# the layer counters Alabaster displays come from it, and they must keep
# working whether or not a pause is armed.
#
# This runs on every layer change, so it must never wait on the motion queue
# with M400: the print would stall, and leave a blob, at each layer.
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _ALABASTER_PRINT_STATS_INFO_BASE
gcode:
  _ALABASTER_PRINT_STATS_INFO_BASE {rawparams}
  {% set state = printer["gcode_macro _ALABASTER_STATE"] %}
  {% set armed = state.pause_at_layer | int %}
  {% set elapsed = printer.print_stats.total_duration %}
  {% if armed >= 0 %}
    {% if elapsed < state.pause_checked_at %}
      # The print time went backwards, so this is a new print: the layer was
      # armed during one that finished before reaching it.
      SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE=-1
    {% elif params.CURRENT_LAYER is defined and params.CURRENT_LAYER | int >= armed %}
      SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_at_layer VALUE=-1
      { state.pause_macro }
    {% else %}
      SET_GCODE_VARIABLE MACRO=_ALABASTER_STATE VARIABLE=pause_checked_at VALUE={ elapsed }
    {% endif %}
  {% endif %}


# --------------------------------------------------------------------------
# Filament
# --------------------------------------------------------------------------
#
# Klipper defines no load or unload macros of its own, so Alabaster's Extruder
# card has nothing to offer until something does. These are deliberately plain:
# they move filament and nothing else. Set the lengths to match the distance
# between your extruder and your nozzle in alabaster-user.cfg.

[gcode_macro _ALABASTER_FILAMENT]
description: Lengths and speeds for loading and unloading. Change them in alabaster-user.cfg.
variable_load_length: 90
variable_load_speed: 10
variable_purge_length: 40
variable_purge_speed: 3
variable_unload_length: 100
variable_unload_speed: 10
variable_minimum_temperature: 180
gcode:
  # Settings only; Klipper requires the key.

[gcode_macro LOAD_FILAMENT]
description: Feed filament to the nozzle and purge. TEMP= heats the hotend first.
gcode:
  {% if params.TEMP is defined and params.TEMP | float > 0 %}
    M109 S{params.TEMP | float}
  {% endif %}
  _ALABASTER_MOVE_FILAMENT ACTION=load

[gcode_macro UNLOAD_FILAMENT]
description: Retract filament clear of the hotend. TEMP= heats the hotend first.
gcode:
  {% if params.TEMP is defined and params.TEMP | float > 0 %}
    M109 S{params.TEMP | float}
  {% endif %}
  _ALABASTER_MOVE_FILAMENT ACTION=unload

# A macro of its own so the temperature check reads the hotend after any
# heating the caller asked for, not before it.
[gcode_macro _ALABASTER_MOVE_FILAMENT]
description: Load or unload, once the hotend is hot enough.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER_FILAMENT"] %}
  {% set extruder = printer.toolhead.extruder %}
  {% set load = params.ACTION | default('load') | lower == 'load' %}
  {% if not extruder %}
    RESPOND TYPE=error MSG="Alabaster: this printer has no extruder."
  {% elif printer[extruder].temperature < settings.minimum_temperature %}
    RESPOND TYPE=error MSG="Alabaster: heat the hotend to at least { settings.minimum_temperature }C first."
  {% else %}
    SAVE_GCODE_STATE NAME=_ALABASTER_FILAMENT_STATE
    M83
    {% if load %}
      G1 E{settings.load_length} F{settings.load_speed * 60}
      G1 E{settings.purge_length} F{settings.purge_speed * 60}
    {% else %}
      # A short purge first softens the tip, so the filament leaves cleanly
      # rather than dragging a string back up the heat break.
      G1 E{settings.purge_length / 4} F{settings.purge_speed * 60}
      G1 E-{settings.unload_length} F{settings.unload_speed * 60}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_ALABASTER_FILAMENT_STATE
    # Waits for the filament to stop moving, so the message means done.
    M400
    RESPOND MSG="Alabaster: filament { 'loaded' if load else 'unloaded' }."
  {% endif %}


# --------------------------------------------------------------------------
# Purge
# --------------------------------------------------------------------------
#
# A purge line drawn beside the objects being printed, ending as close as it
# can to where the print starts, so the nozzle has little time to ooze
# between the two. Call it from your start G-code once the hotend is at
# temperature and any bed mesh is loaded, as the last step before printing:
#
#     ADAPTIVE_PURGE
#
# It finds the objects from the slicer's object labels ("Label objects" in
# PrusaSlicer and OrcaSlicer). Without them it purges along the edge of the
# bed and says so.
#
# Klipper cannot see where the first layer starts until the slicer moves
# there, so the line ends as close as it can get to the middle of one of the
# objects. If you know the start point, pass it: ADAPTIVE_PURGE X=120 Y=80.

[gcode_macro _ALABASTER_PURGE]
description: Settings for ADAPTIVE_PURGE. Change them in alabaster-user.cfg.
variable_length: 25
variable_flow: 8
variable_height: 0.6
variable_margin: 10
variable_edge: 5
variable_sides: 'front, left, right, back'
variable_tip_distance: 0
variable_retract: 0.8
gcode:
  # Settings only; Klipper requires the key.

[gcode_macro ADAPTIVE_PURGE]
description: Purge beside the print, ending near where it starts. X= and Y= give the start point if you know it.
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if not extruder %}
    RESPOND TYPE=error MSG="Alabaster: this printer has no extruder."
  {% elif not ("x" in homed and "y" in homed and "z" in homed) %}
    RESPOND TYPE=error MSG="Alabaster: home all axes before purging. Purge skipped."
  {% elif printer[extruder].target <= 0 %}
    RESPOND TYPE=error MSG="Alabaster: set a hotend temperature before purging. Purge skipped."
  {% elif printer["gcode_macro _ALABASTER_PURGE"].length <= 0 %}
    RESPOND MSG="Alabaster: purge length is 0. Purge skipped."
  {% else %}
    # Returns at once when the hotend has already settled at its target.
    M109 S{printer[extruder].target}
    _ALABASTER_PURGE_LINE {rawparams}
  {% endif %}

# A macro of its own so the extrusion check reads the hotend after the wait
# above, not before it.
[gcode_macro _ALABASTER_PURGE_LINE]
description: Plan and draw the purge line.
gcode:
  {% set settings = printer["gcode_macro _ALABASTER_PURGE"] %}
  {% set extruder = printer.toolhead.extruder %}
  {% if not printer[extruder].can_extrude %}
    RESPOND TYPE=error MSG="Alabaster: the hotend is too cold to extrude. Purge skipped."
  {% else %}
    {% set config = printer.configfile.settings[extruder] %}
    {% set minimum = printer.toolhead.axis_minimum %}
    {% set maximum = printer.toolhead.axis_maximum %}
    {% set nozzle = config.nozzle_diameter %}
    {% set height = settings.height %}
    # Multiplied out rather than written with **: Jinja's power operator does
    # not take Python's precedence around a unary minus.
    {% set filament_area = 3.14159265 * config.filament_diameter * config.filament_diameter / 4 %}
    {% set limit = config.max_extrude_cross_section | default(4 * nozzle * nozzle) %}

    # Two stages: a thick, slow line that flushes most of the volume, then a
    # thin, faster one at the same flow that settles the nozzle pressure the
    # way a printed line will. Neither may pass Klipper's cross-section
    # limit, which stops the print with an error rather than skipping a move.
    {% set thick = [2.5 * nozzle, 0.9 * limit / height] | min %}
    {% set thin = [1.25 * nozzle, thick] | min %}
    {% set pitch = 2 * thick %}
    {% set volume = settings.length * filament_area %}
    {% set settle = [20.0, volume / (thin * height)] | min %}
    {% set flush = (volume - settle * thin * height) / (thick * height) %}
    {% set path = flush + settle %}

    {% set scan = namespace(points=[], centres=[]) %}
    {% for object in printer.exclude_object.objects %}
      {% if object.polygon is defined %}
        {% set scan.points = scan.points + object.polygon %}
      {% endif %}
      {% if object.center is defined %}
        {% set scan.points = scan.points + [object.center] %}
        {% set scan.centres = scan.centres + [object.center] %}
      {% elif object.polygon is defined %}
        {% set xs = object.polygon | map(attribute=0) | list %}
        {% set ys = object.polygon | map(attribute=1) | list %}
        {% set scan.centres = scan.centres + [[((xs | min) + (xs | max)) / 2, ((ys | min) + (ys | max)) / 2]] %}
      {% endif %}
    {% endfor %}
    {% set found = scan.points | length > 0 %}
    {% if found %}
      {% set low_x = scan.points | map(attribute=0) | min %}
      {% set high_x = scan.points | map(attribute=0) | max %}
      {% set low_y = scan.points | map(attribute=1) | min %}
      {% set high_y = scan.points | map(attribute=1) | max %}
    {% else %}
      {% set low_x = (minimum.x + maximum.x) / 2 %}
      {% set high_x = low_x %}
      {% set low_y = (minimum.y + maximum.y) / 2 %}
      {% set high_y = low_y %}
      RESPOND MSG="Alabaster: this print has no object labels, so the purge goes along the edge of the bed. Turn on Label objects in your slicer to purge beside the print."
    {% endif %}
    # Where the first layer is likely to start. Without a hint, every object
    # is a candidate: the slicer begins at one of them, and the middle of a
    # spread-out plate can be empty bed far from all of them.
    {% if params.X is defined or params.Y is defined %}
      {% set targets = [[params.X | float if params.X is defined else (low_x + high_x) / 2,
                         params.Y | float if params.Y is defined else (low_y + high_y) / 2]] %}
    {% elif found %}
      {% set targets = scan.centres %}
    {% else %}
      {% set targets = [[low_x, low_y]] %}
    {% endif %}

    # For each side: rows run along that side, the first one farthest out,
    # zigzagging in so the last row ends at the point nearest a target.
    {% set plan = namespace(side='', distance=-1.0, along_x=True, outward=-1, rows=1,
                            row=0.0, outer=0.0, direction=1, end=0.0, edge=0.0) %}
    {% for entry in settings.sides.split(',') %}
      {% set side = entry | trim | lower %}
      {% if side in ['front', 'back', 'left', 'right'] %}
        {% set along_x = side in ['front', 'back'] %}
        {% set outward = -1 if side in ['front', 'left'] else 1 %}
        {% set lat_lo = (minimum.x if along_x else minimum.y) + settings.edge %}
        {% set lat_hi = (maximum.x if along_x else maximum.y) - settings.edge %}
        {% set band_lo = (minimum.y if along_x else minimum.x) + settings.edge %}
        {% set band_hi = (maximum.y if along_x else maximum.x) - settings.edge %}
        {% set longest = lat_hi - lat_lo %}
        {% set edge_of_print = {'front': low_y, 'back': high_y, 'left': low_x, 'right': high_x}[side] %}
        {% for target in targets %}
          {% set target_lat = target[0] if along_x else target[1] %}
          {% set target_band = target[1] if along_x else target[0] %}
          # The last row may run either way along the side, which decides
          # how close to each end of the side it can stop.
          {% for direction in [1, -1] %}
            # Rows no longer than the room behind the target let the line
            # stop level with it; full-length rows are the fallback when
            # the extra rows that takes do not fit. Rows shorter than 20 mm
            # are not worth the extra turns.
            {% set reach = (target_lat - lat_lo) if direction > 0 else (lat_hi - target_lat) %}
            {% for cap in [[reach, longest] | min, longest] %}
              {% if cap >= [path, 20.0] | min %}
                # Slightly under the true count before rounding up, so
                # floating-point noise on an exact fit cannot add a row.
                {% set rows = ((path + pitch) / ([path, cap] | min + pitch) - 0.000001) | round(0, 'ceil') | int %}
                # Equal rows, so the zigzag can slide along the side as one piece.
                {% set row = (path - (rows - 1) * pitch) / rows %}
                {% if found %}
                  {% set inner = edge_of_print + outward * (settings.margin + thick / 2) %}
                  {% set outer = inner + outward * (rows - 1) * pitch %}
                {% else %}
                  {% set outer = band_lo if outward < 0 else band_hi %}
                  {% set inner = outer - outward * (rows - 1) * pitch %}
                {% endif %}
                {% if row > 0 and band_lo <= [inner, outer] | min and [inner, outer] | max <= band_hi %}
                  {% set end = [[target_lat, lat_lo + (row if direction > 0 else 0)] | max,
                                lat_hi - (0 if direction > 0 else row)] | min %}
                  {% set distance = (end - target_lat) * (end - target_lat)
                                    + (inner - target_band) * (inner - target_band) %}
                  # Within a millimetre counts as a tie, and a tie goes to
                  # fewer rows: they are quicker to draw and to peel off.
                  {% if plan.distance < 0 or distance < plan.distance - 1
                        or (distance < plan.distance + 1 and rows < plan.rows) %}
                    {% set plan.side = side %}
                    {% set plan.distance = distance %}
                    {% set plan.along_x = along_x %}
                    {% set plan.outward = outward %}
                    {% set plan.rows = rows %}
                    {% set plan.row = row %}
                    {% set plan.outer = outer %}
                    {% set plan.direction = direction %}
                    {% set plan.end = end %}
                    {% set plan.edge = edge_of_print %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
        {% endfor %}
      {% endif %}
    {% endfor %}

    {% if not plan.side %}
      RESPOND TYPE=error MSG="Alabaster: no room for a purge line beside the print. Purge skipped."
    {% else %}
      # Every row covers the same stretch, from row_start to plan.end. The
      # last runs toward plan.end, and the ones before it alternate.
      {% set row_start = plan.end - plan.direction * plan.row %}
      {% set legs = namespace(all=[], lat=0.0, band=0.0, start=[]) %}
      {% for index in range(plan.rows) %}
        {% set band = plan.outer - plan.outward * index * pitch %}
        {% set forward = (plan.rows - 1 - index) % 2 == 0 %}
        {% if index == 0 %}
          {% set legs.start = [row_start if forward else plan.end, band] %}
        {% else %}
          {% set legs.all = legs.all + [[legs.lat, band, pitch]] %}
        {% endif %}
        {% set legs.lat = plan.end if forward else row_start %}
        {% set legs.all = legs.all + [[legs.lat, band, plan.row]] %}
        {% set legs.band = band %}
      {% endfor %}
      # Off the end of the line, sideways toward the print, but never more
      # than halfway across the margin.
      {% set snap = legs.band - plan.outward * ([5.0, settings.margin / 2] | min) %}
      # Where the filament goes back in: the start point when it is known,
      # otherwise the edge of the print straight in from the purge.
      {% if params.X is defined or params.Y is defined %}
        # A typed start point outside the axes would stop the print with a
        # move out of range.
        {% set handoff = [[[targets[0][0], minimum.x] | max, maximum.x] | min,
                          [[targets[0][1], minimum.y] | max, maximum.y] | min] %}
      {% elif found %}
        {% set handoff = [plan.end, plan.edge] if plan.along_x else [plan.edge, plan.end] %}
      {% else %}
        {% set handoff = [plan.end, snap] if plan.along_x else [snap, plan.end] %}
      {% endif %}

      {% set travel = printer["gcode_macro _ALABASTER"].travel_speed * 60 %}
      {% set start = legs.start %}
      SAVE_GCODE_STATE NAME=_ALABASTER_PURGE_STATE
      G90
      M83
      G1 Z{[printer.gcode_move.gcode_position.z, height + 2] | max} F{travel}
      G1 X{(start[0] if plan.along_x else start[1]) | round(3)} Y{(start[1] if plan.along_x else start[0]) | round(3)} F{travel}
      G1 Z{height} F{travel}
      {% if settings.tip_distance > 0 %}
        G1 E{settings.tip_distance} F{(settings.flow / filament_area * 60) | round(1)}
      {% endif %}
      {% set run = namespace(position=0.0, lat=start[0], band=start[1]) %}
      {% for leg in legs.all %}
        {% set reach = run.position + leg[2] %}
        {% if run.position < flush and reach > flush %}
          # The flush ends partway along this leg: split it there.
          {% set share = (flush - run.position) / leg[2] %}
          {% set pieces = [[run.lat + (leg[0] - run.lat) * share, run.band + (leg[1] - run.band) * share, flush - run.position, thick],
                           [leg[0], leg[1], reach - flush, thin]] %}
        {% else %}
          {% set pieces = [[leg[0], leg[1], leg[2], thick if run.position < flush else thin]] %}
        {% endif %}
        {% for piece in pieces %}
          G1 X{(piece[0] if plan.along_x else piece[1]) | round(3)} Y{(piece[1] if plan.along_x else piece[0]) | round(3)} E{(piece[2] * piece[3] * height / filament_area) | round(4)} F{(settings.flow / (piece[3] * height) * 60) | round(1)}
        {% endfor %}
        {% set run.position = reach %}
        {% set run.lat = leg[0] %}
        {% set run.band = leg[1] %}
      {% endfor %}
      # Retracting during a fast move breaks the strand at the line. Moving
      # first and retracting after, or lifting, only stretches it toward the
      # print. Z stays at line height: nothing has been printed yet to clear.
      G1 X{(plan.end if plan.along_x else snap) | round(3)} Y{(snap if plan.along_x else plan.end) | round(3)} E-{settings.retract} F{travel}
      G1 X{handoff[0] | round(3)} Y{handoff[1] | round(3)} F{travel}
      # Pushed back out here, so the print starts with the nozzle full, the
      # way the slicer expects to find it.
      G1 E{settings.retract} F{printer["gcode_macro _ALABASTER"].unretract_speed * 60}
      RESTORE_GCODE_STATE NAME=_ALABASTER_PURGE_STATE
      RESPOND MSG="Alabaster: purged {settings.length} mm of filament on the {plan.side} side of the print."
    {% endif %}
  {% endif %}


# --------------------------------------------------------------------------
# Your settings
# --------------------------------------------------------------------------
#
# Last in the file, so every value it sets replaces a default above. The [g]
# makes the include a pattern, and Klipper accepts a pattern that matches
# nothing: a printer without alabaster-user.cfg still starts, on the defaults.
# A plain name would stop Klipper at startup, including on every printer that
# updates the pack before re-running the installer that creates the file.

[include alabaster-user.cf[g]]
