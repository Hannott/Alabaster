# Alabaster — nginx site
#
# The installer writes this file with the placeholders replaced. To use it by
# hand, substitute:
#
#   __PORT__       the port Alabaster is served on, such as 8081
#   __ROOT__       where the release was installed, such as /home/pi/alabaster
#   __MOONRAKER__  Moonraker's own address, normally 127.0.0.1:7125
#
# This is the on-printer arrangement: nginx serves Alabaster and proxies
# Moonraker, so the browser sees one origin and no CORS configuration is
# needed anywhere.
#
# Serving Alabaster from a separate host instead? Keep only the `location /`
# block and delete the proxies. The browser reaches each printer's Moonraker
# directly, and each of those printers needs this host's address in its
# `[authorization] cors_domains`.

server {
    listen __PORT__ default_server;
    listen [::]:__PORT__ default_server;
    server_name _;

    root __ROOT__;
    index index.html;

    access_log /var/log/nginx/alabaster-access.log;
    error_log /var/log/nginx/alabaster-error.log;

    # G-code files are routinely hundreds of megabytes. nginx defaults to 1 MB,
    # which rejects the upload with a 413 and no useful explanation in the
    # interface — so uploads are uncapped here and Moonraker enforces its own
    # limit instead.
    client_max_body_size 0;

    # Alabaster routes on the URL hash, so every path is served by index.html
    # and the router takes it from there. No rewrite rules beyond this.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable: the filename changes when the content does,
    # so they never need revalidating. index.html must not be cached, or an
    # update leaves the browser loading the previous release's assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The one socket Alabaster opens. Without the upgrade headers the
    # connection is refused and every screen sits at "connecting".
    location /websocket {
        proxy_pass http://__MOONRAKER__/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A printer can sit idle far longer than nginx's default 60s before it
        # says anything. Timing the socket out would look like a disconnect.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://__MOONRAKER__$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        # Uploads and thumbnail downloads stream rather than being buffered to
        # disk first, which matters on a Pi with a slow SD card.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Webcam streams, where Moonraker proxies them.
    location /webcam/ {
        proxy_pass http://__MOONRAKER__/webcam/;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
}
