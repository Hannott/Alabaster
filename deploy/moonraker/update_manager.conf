# Alabaster — Moonraker update manager
#
# Append this to moonraker.conf and restart Moonraker. Alabaster then appears
# on its own Machine page alongside Klipper and Moonraker, and updates from
# there.
#
# The installer offers to add both blocks for you.
#
# Two entries, because the app and its macro pack are tracked in different
# ways:
#
#   * `alabaster` is `type: web` — a downloaded, versioned release archive.
#     Its section name decides which release asset Moonraker looks for:
#     `<section name>.zip`, and releases publish `alabaster.zip`, so renaming
#     this section stops updates working. `path` must be a plain directory —
#     not inside a git repository, and not shared with anything else, since
#     Moonraker replaces its contents wholesale on every update.
#
#   * `alabaster-config` is `type: git_repo` — a git clone of the same
#     repository, updated with `git pull` rather than a downloaded archive.
#     It is a second clone of Hannott/Alabaster, not a separate project, so
#     its version can never drift from the app it shipped with. `path` here
#     must be a real git working tree — the opposite requirement from the
#     block above.
#
# alabaster.cfg itself lives with printer.cfg, symlinked into this clone, so
# it stays visible to Moonraker's own file API (and to Alabaster's own
# Configuration page) while still being the file `git pull` updates. Editing
# it directly is fine; it will show up as local changes on the Machine page
# until you either revert them or accept that this repository will need
# `git_repo`'s recovery flow on its next update.
#
# Change `path` on either block if you installed somewhere other than the
# defaults below.

[update_manager alabaster]
type: web
channel: stable
repo: Hannott/Alabaster
path: ~/alabaster

[update_manager alabaster-config]
type: git_repo
channel: stable
path: ~/alabaster-config
origin: https://github.com/Hannott/Alabaster.git
primary_branch: main
managed_services: klipper

# Switch either block to `channel: beta` to be offered pre-releases as well.
